<html lang="ko">

<meta charset="UTF-8">

<style>
.mk-off *{animation-play-state:paused !important}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:transparent}
body{display:flex;justify-content:center;align-items:center;-webkit-tap-highlight-color:transparent}
body{background:transparent}
.ph{position:relative;width:100vw;height:100vh;max-width:calc(100vh * 9 / 16);max-height:calc(100vw * 16 / 9);aspect-ratio:9/16;background:#000;overflow:hidden;border-radius:4px;--u:calc(min(100vw, 56.25vh) / 100);touch-action:manipulation;box-shadow:0 0 24px rgba(255,255,255,.12)}
.ph.full{background:#000;box-shadow:none;border-radius:0}
.pv{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);width:100%;aspect-ratio:1/1;overflow:hidden;z-index:1}
.fitw{position:absolute;top:0;left:0;width:100%;height:100%;will-change:transform}
.pv.zoom{top:50%;width:100%;height:100%;aspect-ratio:auto;z-index:30;cursor:pointer;background:transparent}
.pv img{width:100%;height:100%;object-fit:cover;display:block;filter:blur(6px);will-change:transform,filter;-webkit-backface-visibility:hidden;backface-visibility:hidden}
@media (prefers-reduced-motion: no-preference){
.pv img{animation:pcIdle 7s ease-in-out infinite}
@keyframes pcIdle{0%,100%{transform:scale3d(1.06,1.06,1) translate3d(0,0,0)}50%{transform:scale3d(1.1,1.1,1) translate3d(-1%,1%,0)}}
.fbox{animation:fpulse 2s ease-in-out infinite}
@keyframes fpulse{0%,100%{opacity:.9;transform:translate(-50%,-50%) scale(1)}50%{opacity:.5;transform:translate(-50%,-50%) scale(.96)}}
}
.pv.zoom img{object-fit:contain;filter:none;animation:pcZoom .42s cubic-bezier(.16,1,.3,1) forwards}
@keyframes pcZoom{0%{transform:scale3d(.96,.96,1);opacity:1}100%{transform:scale3d(1,1,1);opacity:1}}
@media (prefers-reduced-motion: reduce){
.pv.zoom img{animation:none;filter:none;transform:none}
}
.grid{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none;transition:opacity .1s ease;--lw:calc(var(--u) * .25);background-image:linear-gradient(90deg,transparent calc(33.3% - var(--lw)),rgba(255,255,255,.32) 33.3%,transparent calc(33.3% + var(--lw)),transparent calc(66.6% - var(--lw)),rgba(255,255,255,.32) 66.6%,transparent calc(66.6% + var(--lw))),linear-gradient(0deg,transparent calc(33.3% - var(--lw)),rgba(255,255,255,.32) 33.3%,transparent calc(33.3% + var(--lw)),transparent calc(66.6% - var(--lw)),rgba(255,255,255,.32) 66.6%,transparent calc(66.6% + var(--lw)))}
.fbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1;border:calc(var(--u)*.45) solid #ffd60a;border-radius:3px;box-shadow:0 0 8px rgba(0,0,0,.25)}
.ui{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;pointer-events:none;transition:opacity .1s ease;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
.tbar{position:absolute;top:calc(var(--u)*4);width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 calc(var(--u)*5);box-sizing:border-box}
.tic{width:calc(var(--u)*7);height:calc(var(--u)*7);display:flex;align-items:center;justify-content:center}
.tic.mid{background:rgba(255,255,255,.15);border-radius:50%}
.tic svg{width:68%;height:68%}
.barea{position:absolute;bottom:calc(var(--u)*7);width:100%;display:flex;flex-direction:column;align-items:center}
.modes{display:flex;gap:calc(var(--u)*4.6);margin-bottom:calc(var(--u)*8);font-size:calc(var(--u)*3.4);font-weight:600;color:rgba(255,255,255,.75);letter-spacing:-.3px}
.modes .on{color:#ffd60a}
.bctl{display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 calc(var(--u)*9);box-sizing:border-box}
.thumb{width:calc(var(--u)*11);height:calc(var(--u)*11);border-radius:calc(var(--u)*1.6);background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.35)}
.shut{width:calc(var(--u)*17.5);height:calc(var(--u)*17.5);border-radius:50%;background:#fff;border:calc(var(--u)*.8) solid #000;box-shadow:0 0 0 calc(var(--u)*1) #fff;cursor:pointer;pointer-events:auto;transition:transform .1s ease}
.shut:active{transform:scale(.88)}
.flipb{width:calc(var(--u)*11);height:calc(var(--u)*11);border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center}
.flipb svg{width:52%;height:52%}
.flash{position:absolute;top:0;left:0;width:100%;height:100%;background:#fff;opacity:0;z-index:100;pointer-events:none;will-change:opacity}
.flash.go{animation:pcFlash .8s ease-out forwards}
@keyframes pcFlash{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
.again{position:absolute;left:50%;bottom:4%;z-index:40;transform:translateX(-50%) translateY(8px);padding:7px 12px;border-radius:999px;background:rgba(20,20,20,.72);color:#fff;font:600 calc(var(--u)*3.2)/1.2 -apple-system,"Segoe UI",sans-serif;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease}
.ph.full .again{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{opacity:0 !important;pointer-events:none !important}
</style>
<style>.mk-key-focus:focus-visible{outline:3px solid #ffd66b!important;outline-offset:4px!important}</style>

    <div class="fitw"><img id="pimg" src="./1.webp" alt=""></div>

  </div>
  <div class="ui" id="ui">
    <div class="tbar">

      <div class="bctl">
        <div class="thumb" style="background-image:url('./1.webp')"></div>
        <div class="shut" id="shut"></div>

      </div>
    </div>
  </div>
  <div class="again" aria-hidden="true">사진을 누르면 다시 촬영</div>
</div>

function shutterSound(){try{sndA.currentTime=0;sndA.play();}catch(e){}}
function flashSwap(fn){
  flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');
  setTimeout(fn,90);
}
shut.addEventListener('click',function(){
  if(state!==0)return;
  state=1;shutterSound();
  flashSwap(function(){
    ui.classList.add('hidden');grid.classList.add('hidden');
    ph.classList.add('full');pv.classList.add('zoom');
  });
  setTimeout(function(){state=2;},520);
});
pv.addEventListener('click',function(){
  if(state!==2)return;
  state=1;
  flashSwap(function(){
    pv.classList.remove('zoom');ph.classList.remove('full');
    ui.classList.remove('hidden');grid.classList.remove('hidden');
  });
  setTimeout(function(){state=0;},520);
});
})();
