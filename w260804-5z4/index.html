<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reveal</title>
<script>
(function(){try{
if(!('IntersectionObserver' in window))return;
var io=new IntersectionObserver(function(es){
  var v=es[0]&&es[0].isIntersecting;
  document.documentElement.classList.toggle('mk-off',!v);
},{threshold:0});
io.observe(document.documentElement);
}catch(e){}})();
</script>
<style>
.mk-off *{animation-play-state:paused !important}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:transparent}
body{display:flex;justify-content:center;align-items:center;-webkit-tap-highlight-color:transparent}
.float{line-height:0;will-change:transform}
@media (prefers-reduced-motion: no-preference){
.float{animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
}
.mb{position:relative;line-height:0;border-radius:22px;overflow:hidden;cursor:pointer;box-shadow:0 18px 42px rgba(0,0,0,.30),0 4px 12px rgba(0,0,0,.16)}
.mb img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.base-img{max-width:96vw;max-height:94vh;width:auto;height:auto;display:block;transform:scale(1.06);transition:transform 1.1s cubic-bezier(.2,.7,.3,1);will-change:transform}
.overlay-img{position:absolute;top:-1px;left:-1px;width:calc(100% + 2px);height:calc(100% + 2px);object-fit:cover;transition:opacity .55s ease,transform .55s ease;will-change:opacity,transform}
.shinewrap{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:3}
.shine{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;will-change:transform;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.38) 50%,transparent 58%);transform:translateX(-120%)}
.mb.on .overlay-img{opacity:0;transform:scale(1.04)}
.mb.on .base-img{transform:scale(1)}
.mb.on .shine{opacity:1;animation:sweep .9s ease .05s forwards}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
</style>
<style>.mk-key-focus:focus-visible{outline:3px solid #ffd66b!important;outline-offset:4px!important}</style>
</head>
<body>
<div class="float"><div class="mb" id="mb">
  <img class="base-img" src="./2.webp" alt="">
  <img class="overlay-img" src="./1.webp" alt="">
  <div class="shinewrap"><div class="shine"></div></div>
</div></div>
<script>
(function(){
function sparks(host,n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var colors=["#ffd97a","#ffe9b0","#ffc65c","#fff3d6"];
  for(var i=0;i<n;i++){
    var s=document.createElement("span");
    s.textContent=Math.random()<.55?"\u2726":"\u25CF";
    s.style.cssText="position:absolute;left:50%;top:50%;z-index:40;pointer-events:none;"
      +"font:700 "+(9+Math.random()*13)+"px sans-serif;color:"+colors[i%4]+";"
      +"text-shadow:0 0 6px rgba(255,215,130,.8);transform:translate(-50%,-50%);will-change:transform,opacity";
    host.appendChild(s);
    var a=Math.random()*Math.PI*2,d=80+Math.random()*150;
    var dx=Math.cos(a)*d,dy=Math.sin(a)*d-30;
    s.animate([
      {transform:"translate(-50%,-50%) scale(.4) rotate(0deg)",opacity:1},
      {transform:"translate(calc(-50% + "+dx+"px), calc(-50% + "+dy+"px)) scale(1.15) rotate("+(Math.random()*260-130)+"deg)",opacity:0}
    ],{duration:650+Math.random()*400,easing:"cubic-bezier(.15,.75,.4,1)"})
    .onfinish=(function(el){return function(){el.remove();};})(s);
  }
}
var mb=document.getElementById('mb'),lastTouch=0;
function on(){if(!mb.classList.contains('on')){mb.classList.add('on');sparks(mb,8);}}
function off(){mb.classList.remove('on');}
mb.addEventListener('contextmenu',function(e){e.preventDefault();});
var hit=document.body;
var tT=0,tMoved=false,tStart=0;
hit.addEventListener('touchstart',function(){lastTouch=Date.now();tStart=Date.now();tMoved=false;clearTimeout(tT);tT=setTimeout(function(){if(!tMoved)on();},140);},{passive:true});
hit.addEventListener('touchmove',function(){tMoved=true;clearTimeout(tT);},{passive:true});
hit.addEventListener('touchend',function(e){lastTouch=Date.now();clearTimeout(tT);if(!tMoved&&Date.now()-tStart<260){if(mb.classList.contains('on'))off();else on();return;}if(e.touches.length===0)off();});
hit.addEventListener('touchcancel',function(){clearTimeout(tT);off();});
hit.addEventListener('mouseenter',function(){if(Date.now()-lastTouch>800)on();});
hit.addEventListener('mouseleave',function(){if(Date.now()-lastTouch>800)off();});
})();
</script>
<script>
(function(){
var nodes=[].slice.call(document.querySelectorAll("#mb"));
nodes.forEach(function(el){el.tabIndex=0;el.setAttribute("role","button");el.setAttribute("aria-label","사진 공개하기");el.classList.add("mk-key-focus");
el.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;e.preventDefault();el.classList.toggle("on");});});
})();
</script>
</body>
</html>
