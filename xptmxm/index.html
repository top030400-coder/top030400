<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3d card</title>
<script>
(function(){try{
if(!('IntersectionObserver' in window))return;
var io=new IntersectionObserver(function(es){
  var v=es[0]&&es[0].isIntersecting;
  document.documentElement.classList.toggle('mk-off',!v);
},{threshold:0});
io.observe(document.documentElement);
}catch(e){}})();
</script>
<style>
.mk-off *{animation-play-state:paused !important}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:transparent}
body{display:flex;justify-content:center;align-items:center;-webkit-tap-highlight-color:transparent}
body{user-select:none;-webkit-user-select:none}
.scene{perspective:1300px;display:flex;justify-content:center;align-items:center;width:100vw;height:100vh}
.card{touch-action:none;cursor:grab}
.card:active{cursor:grabbing}
.ground{position:fixed;left:50%;bottom:3%;transform:translateX(-50%);width:56vmin;height:7vmin;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse,rgba(0,0,0,.28),transparent 68%)}
.card{--depth:2px;--side-color:#ccc;position:relative;transform-style:preserve-3d;display:inline-block;font-size:0;line-height:0;will-change:transform;transform-origin:center center calc(var(--depth) / -2)}
.face{position:absolute;backface-visibility:hidden;overflow:hidden}
.side{backface-visibility:visible;background:var(--side-color)}
.face-front{position:relative;z-index:2;background:transparent;transform:translateZ(0)}
.face-back{top:0;left:0;width:100%;height:100%;z-index:1;background:transparent;overflow:hidden;transform:translateZ(calc(var(--depth) * -1)) rotateY(180deg)}
.face-right{top:0;right:0;width:var(--depth);height:100%;transform-origin:right;transform:rotateY(90deg)}
.face-left{top:0;left:0;width:var(--depth);height:100%;transform-origin:left;transform:rotateY(-90deg)}
.face-top{top:0;left:0;width:100%;height:var(--depth);transform-origin:top;transform:rotateX(90deg)}
.face-bottom{bottom:0;left:0;width:100%;height:var(--depth);transform-origin:bottom;transform:rotateX(-90deg)}
.face img{display:block;width:auto;height:auto;max-width:90vw;max-height:84vh;pointer-events:none;-webkit-user-drag:none;outline:1px solid transparent}
.face-back img{width:100%;height:100%;max-width:none;max-height:none;aspect-ratio:auto;object-fit:cover}
.glarewrap{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:3}
.glare{position:absolute;top:0;left:0;width:100%;height:100%;opacity:.3;will-change:transform,opacity;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.42) 50%,transparent 62%)}
</style>
<style>
#mk-common-decor{position:fixed;inset:0;width:100vw;height:100vh;z-index:2147483646;pointer-events:none!important;overflow:hidden;contain:layout style;transform:none}
#mk-common-decor img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none!important;user-select:none}
</style>
</head>
<body>
<div class="ground"></div>
<div class="scene" id="scene">
  <div class="card" id="card">
    <div class="face face-front" data-mk-adjust-box="front"><img src="./1.webp" alt=""><div class="glarewrap"><div class="glare" id="glare"></div></div></div>
    <div class="face face-back" data-mk-adjust-box="back"><img src="./2.webp" alt=""></div>
    <div class="face side face-right"></div>
    <div class="face side face-left"></div>
    <div class="face side face-top"></div>
    <div class="face side face-bottom"></div>
  </div>
</div>
<script>
(function(){
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
var EDIT="";
var scene=document.getElementById('scene'),card=document.getElementById('card'),
  glare=document.getElementById('glare');
var rx=EDIT?0:-8,ry=EDIT==='back'?180:(EDIT?0:22),vx=0,vy=0,lx=0,ly=0,dragging=false,interacted=!!EDIT,returning=false;
var lastG=-999,ptrId=null,lastMoveT=0;
if(RM&&!EDIT){rx=0;ry=0;}
function render(){
  card.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)';
  var g=((ry%360)+360)%360;
  if(Math.abs(g-lastG)>.4){
    lastG=g;
    var a=((g+180)%360)-180;
    glare.style.opacity=Math.max(0,Math.cos(g*Math.PI/180))*.4;
    glare.style.transform='translateX('+(-a*1.1)+'%)';
  }
}
var idle=false,lastTs=0;
function loop(ts){
  var f=lastTs?Math.min(3,Math.max(.25,(ts-lastTs)/16.7)):1; lastTs=ts;
  if(!dragging){
    if(returning){
      rx+=(0-rx)*.12*f; ry+=(0-ry)*.12*f;
      if(Math.abs(rx)<.2&&Math.abs(ry)<.2){rx=0;ry=0;returning=false;}
    }else if(!RM){
      rx+=vx*f; ry+=vy*f; var dmp=Math.pow(.94,f); vx*=dmp; vy*=dmp;
      if(Math.abs(vx)<.01)vx=0;
      if(Math.abs(vy)<.01)vy=0;
      if(!interacted)ry+=.12*f;
    }
  }
  var moving=dragging||returning||vx!==0||vy!==0||(!interacted&&!RM);
  if(moving){render();idle=false;}
  else if(!idle){render();idle=true;}
  requestAnimationFrame(loop);
}
var downX=0,downY=0,downT=0,lastTap=0;
card.addEventListener('pointerdown',function(e){
  if(dragging)return;
  ptrId=e.pointerId;
  dragging=true;interacted=true;returning=false;vx=0;vy=0;lx=e.clientX;ly=e.clientY;
  downX=e.clientX;downY=e.clientY;downT=Date.now();
  lastMoveT=Date.now();
  try{card.setPointerCapture(e.pointerId);}catch(err){}
});
card.addEventListener('pointermove',function(e){
  if(!dragging||e.pointerId!==ptrId)return;
  var dx=e.clientX-lx,dy=e.clientY-ly;
  var fl=Math.cos(rx*Math.PI/180)<0?-1:1;
  ry+=dx*.35*fl; rx-=dy*.35;
  var mdt=Math.max(4,Date.now()-lastMoveT);
  if(!RM){vy=Math.max(-9,Math.min(9,dx/mdt*6*fl)); vx=Math.max(-9,Math.min(9,-dy/mdt*6));}
  lx=e.clientX; ly=e.clientY; lastMoveT=Date.now();
  render();
});
function up(e){
  if(!dragging)return;
  if(e&&e.pointerId!==undefined&&e.pointerId!==ptrId)return;
  dragging=false;ptrId=null;
  if(Date.now()-lastMoveT>120){vx=0;vy=0;}
  if(e&&Math.abs(e.clientX-downX)<8&&Math.abs(e.clientY-downY)<8&&Date.now()-downT<260){
    if(Date.now()-lastTap<340){returning=true;vx=0;vy=0;}
    lastTap=Date.now();
  }
}
card.addEventListener('pointerup',up);
card.addEventListener('pointercancel',up);
window.addEventListener('pointerup',up);
window.addEventListener('blur',function(){up();});
scene.addEventListener('dblclick',function(){returning=true;vx=0;vy=0;interacted=true;});
render();
if(!EDIT)loop();
})();
</script>
